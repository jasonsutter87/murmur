[package]
name = "murmur-core"
version = "0.1.0"
edition = "2021"
description = "Shared speech core: mic capture, local whisper transcription, drill scoring."

[dependencies]
anyhow = "1"
cpal = "0.18"
reqwest = { version = "0.13", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
whisper-rs = "0.16"

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }

[dev-dependencies]
hound = "3"
